---
- name: Read the release the node is running
  ansible.builtin.command:
    cmd: >-
      talosctl version --short
      --talosconfig {{ baremetal_talosconfig }}
      --endpoints {{ ansible_host }}
      --nodes {{ ansible_host }}
  changed_when: false
  register: _baremetal_node_release

- name: Set node facts
  ansible.builtin.set_fact:
    _baremetal_release_target: "{{ hostvars['localhost']._baremetal_target_release }}"
    _baremetal_release_current: "{{ (_baremetal_node_release.stdout.split('Tag:') | last).split() | first | default('unknown') }}"

- name: Upgrade the node
  when: _baremetal_release_current != _baremetal_release_target
  block:
    - name: Install the target release
      ansible.builtin.command:
        cmd: >-
          talosctl upgrade
          --image {{ hostvars['localhost']._baremetal_upgrade_image }}
          --talosconfig {{ baremetal_talosconfig }}
          --nodes {{ ansible_host }}
          --timeout {{ baremetal_talos_upgrade_timeout }}
      changed_when: true

    - name: Wait for the node to report the target release
      ansible.builtin.command:
        cmd: >-
          talosctl version --short
          --talosconfig {{ baremetal_talosconfig }}
          --endpoints {{ ansible_host }}
          --nodes {{ ansible_host }}
      changed_when: false
      register: _baremetal_upgraded_release
      until: _baremetal_release_upgrade == _baremetal_release_target
      retries: "{{ baremetal_talos_ready_retries }}"
      delay: "{{ baremetal_talos_ready_delay }}"
      vars:
        _baremetal_release_upgrade: "{{ (_baremetal_upgraded_release.stdout.split('Tag:') | last).split() | first | default('unknown') }}"

    - name: Wait for the node to rejoin the cluster
      kubernetes.core.k8s_info:
        kind: Node
        name: "{{ inventory_hostname }}"
        kubeconfig: "{{ baremetal_kubeconfig }}"
      delegate_to: localhost
      register: _baremetal_node_query
      # One expression rather than two: until takes a condition, not a list. The
      # order matters, because the facts below reach into resources[0] and `and`
      # stops at the first false -- a node that has not come back yet is caught by
      # the length test before anything indexes an empty list.
      until: >-
        _baremetal_node_resources_all | length > 0
        and _baremetal_node_resources_status == 'True'
      retries: "{{ baremetal_talos_ready_retries }}"
      delay: "{{ baremetal_talos_ready_delay }}"
      vars:
        _baremetal_node_resources_all: "{{ _baremetal_node_query.resources | default([]) }}"
        _baremetal_node_resources: "{{ _baremetal_node_query.resources | first }}"
        _baremetal_node_resources_conditions: "{{ _baremetal_node_resources.status.conditions }}"
        _baremetal_node_resources_ready: "{{ _baremetal_node_resources_conditions | selectattr('type', 'equalto', 'Ready') }}"
        _baremetal_node_resources_status: "{{ _baremetal_node_resources_ready | map(attribute='status') | first | default('False') }}"

    - name: Wait for every workload to settle
      kubernetes.core.k8s_info:
        kind: Pod
        kubeconfig: "{{ baremetal_kubeconfig }}"
      # As above: this play targets the members, and only localhost carries an
      # interpreter with the kubernetes library. A kubernetes.core task addressed to
      # a member runs against the machine's own python and fails on the import.
      delegate_to: localhost
      register: _baremetal_pod_data
      until: _pods_ko | length == 0
      retries: "{{ baremetal_talos_ready_retries }}"
      delay: "{{ baremetal_talos_ready_delay }}"
      vars:
        _pods_all: "{{ _baremetal_pod_data.resources | default([]) }}"
        _pods_ko: "{{ _pods_all | rejectattr('status.phase', 'in', ['Running', 'Succeeded']) }}"
