---
- name: Eject boot media
  hosts: _baremetal_inventory_nodes
  connection: local
  gather_facts: false
  roles:
    - pokerops.baremetal.baremetal
  vars:
    bmc_retries: "{{ baremetal_bmc_retries }}"
    bmc_delay: "{{ baremetal_bmc_retry_delay }}"
  tasks:
    - name: Read attached virtual media
      community.general.redfish_info:
        category: "{{ baremetal_bmc_media_category }}"
        command: GetVirtualMedia
        baseuri: "{{ baremetal_bmc_address }}"
        username: "{{ baremetal_bmc_username }}"
        password: "{{ baremetal_bmc_password }}"
        validate_certs: "{{ baremetal_bmc_validate_certs }}"
      register: _baremetal_eject_vmedia
      until: _baremetal_eject_vmedia is not failed
      retries: "{{ bmc_retries }}"
      delay: "{{ bmc_delay }}"

    - name: Eject mounted media
      community.general.redfish_command:
        category: "{{ baremetal_bmc_media_category }}"
        baseuri: "{{ baremetal_bmc_address }}"
        username: "{{ baremetal_bmc_username }}"
        password: "{{ baremetal_bmc_password }}"
        validate_certs: "{{ baremetal_bmc_validate_certs }}"
        resource_id: "{{ baremetal_bmc_system_id }}"
        command: VirtualMediaEject
        virtual_media:
          image_url: "{{ item }}"
      loop: "{{ _eject }}"
      vars:
        _media: "{{ _baremetal_eject_vmedia.redfish_facts.virtual_media.entries | map('last') }}"
        _image: "{{ _media | flatten | selectattr('Image', 'defined') | map(attribute='Image') }}"
        _eject: "{{ _image | select | unique }}"
      failed_when: false
