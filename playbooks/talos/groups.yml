---
- name: Build provisioning groups
  hosts: "{{ baremetal_talos_controlplane_group }}:{{ baremetal_talos_worker_group }}"
  connection: local
  strategy: linear
  gather_facts: false
  vars:
    _baremetal_discovery_port: 50000
    _baremetal_discovery_timeout: 30
  roles:
    - pokerops.baremetal.baremetal
  tasks:
    - name: Check provisioning status
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ _baremetal_discovery_port }}"
        timeout: "{{ _baremetal_discovery_timeout }}"
      failed_when: false
      register: _baremetal_provisioned

    - name: Assign cluster group
      ansible.builtin.group_by:
        key: "_baremetal_inventory_nodes"
      changed_when: false

    - name: Assign provisioning groups
      ansible.builtin.group_by:
        key: "_baremetal_talos_{{ (_reinstall or _unprovisioned) | bool | ternary('install', 'member') }}"
      changed_when: false
      vars:
        _unprovisioned: "{{ _baremetal_provisioned.msg | default('', true) | length > 0 }}"
        _reinstall: "{{ baremetal_reinstall | bool }}"

    - name: Debug provisioning groups # noqa: run-once[task]
      run_once: true
      block:
        - name: Debug install members
          ansible.builtin.debug:
            msg: "The following hosts will be installed {{ groups['_baremetal_talos_install'] | default([]) }}"

        - name: Debug skipped members
          ansible.builtin.debug:
            msg: "The following hosts will be skipped {{ groups['_baremetal_talos_member'] | default([]) }}"

- name: Manage member role groups
  hosts: _baremetal_talos_member
  connection: local
  strategy: linear
  gather_facts: false
  vars:
    _baremetal_discovery_port: 50000
    _baremetal_discovery_timeout: 30
  roles:
    - pokerops.baremetal.baremetal
  tasks:
    - name: Assign member role groups
      ansible.builtin.group_by:
        key: "_baremetal_talos_member_{{ _control | bool | ternary('control', 'worker') }}"
      changed_when: false
      vars:
        _control: "{{ baremetal_talos_controlplane_group in group_names }}"

    - name: Debug provisioning groups # noqa: run-once[task]
      run_once: true
      block:
        - name: Debug control nodes
          ansible.builtin.debug:
            msg: "The following hosts have been detected as control nodes {{ groups['_baremetal_talos_member_control'] | default([]) }}"

        - name: Debug worker nodes
          ansible.builtin.debug:
            msg: "The following hosts have been detected as worker nodes {{ groups['_baremetal_talos_member_worker'] | default([]) }}"

- name: Manage install role groups
  hosts: _baremetal_talos_install
  connection: local
  strategy: linear
  gather_facts: false
  vars:
    _baremetal_discovery_port: 50000
    _baremetal_discovery_timeout: 30
  roles:
    - pokerops.baremetal.baremetal
  tasks:
    - name: Assign install role groups
      ansible.builtin.group_by:
        key: "_baremetal_talos_install_{{ _control | bool | ternary('control', 'worker') }}"
      changed_when: false
      vars:
        _control: "{{ baremetal_talos_controlplane_group in group_names }}"

    - name: Debug provisioning groups # noqa: run-once[task]
      run_once: true
      block:
        - name: Debug control nodes
          ansible.builtin.debug:
            msg: "The following hosts have been detected as control nodes {{ groups['_baremetal_talos_install_control'] | default([]) }}"

        - name: Debug worker nodes
          ansible.builtin.debug:
            msg: "The following hosts have been detected as worker nodes {{ groups['_baremetal_talos_install_worker'] | default([]) }}"

- name: Detect cluster orphans
  hosts: localhost
  connection: local
  strategy: linear
  gather_facts: false
  roles:
    - pokerops.baremetal.baremetal
  tasks:
    - name: Stat cluster talosconfig
      ansible.builtin.stat:
        path: "{{ baremetal_talosconfig }}"
      register: _baremetal_cluster_talosconfig

    # A missing kubeconfig is not the same as an unreadable cluster: bootstrap fetches
    # one further down this same deploy, so refusing here would refuse a condition the
    # run goes on to fix. Fetch it first and let the refusal stand only for what a
    # fetch cannot mend -- no credentials to ask with, or a control plane that is not
    # answering. Tolerated rather than fatal, and a no-op when the file is already
    # there or the fleet has no cluster yet.
    - name: Recover cluster kubeconfig
      ansible.builtin.command:
        cmd: >-
          talosctl kubeconfig {{ baremetal_talos_config_directory }}
          --talosconfig {{ baremetal_talosconfig }}
          --endpoints {{ _endpoint }}
          --nodes {{ _endpoint }}
        creates: "{{ baremetal_kubeconfig }}"
      register: _baremetal_cluster_recover
      failed_when: false
      # Tolerating the failure would otherwise report a fetch that wrote nothing as a
      # change, on the one path where the operator is already looking for what broke.
      changed_when: (_baremetal_cluster_recover.rc | default(1)) == 0
      vars:
        _control: "{{ groups['_baremetal_talos_member_control'] | default([]) }}"
        _endpoint: >-
          {{ baremetal_talos_api_address if baremetal_talos_api_address | length > 0
             else (hostvars[_control | first].ansible_host if _control | length > 0 else '') }}
      when:
        - _baremetal_cluster_talosconfig.stat.exists
        - _endpoint | length > 0

    - name: Stat cluster kubeconfig
      ansible.builtin.stat:
        path: "{{ baremetal_kubeconfig }}"
      register: _baremetal_cluster_kubeconfig

    - name: Query cluster nodes
      kubernetes.core.k8s_info:
        kind: Node
        kubeconfig: "{{ baremetal_kubeconfig }}"
      register: _baremetal_cluster_nodes
      failed_when: false
      when: _baremetal_cluster_kubeconfig.stat.exists

    - name: Initialize cluster membership facts
      ansible.builtin.set_fact:
        _baremetal_talos_orphan_control: []
        _baremetal_talos_orphan_worker: []
        _baremetal_talos_orphans: []
        _baremetal_cluster_readable: "{{ _baremetal_cluster_nodes.resources is defined }}"

    - name: Set orphan membership facts
      ansible.builtin.set_fact:
        _baremetal_talos_orphan_control: "{{ _nodes_control | difference(_inventory_control) }}"
        _baremetal_talos_orphan_worker: "{{ _nodes_worker | difference(_inventory_worker) }}"
        _baremetal_talos_orphans: "{{ _nodes_cluster | difference(_inventory_cluster) }}"
      vars:
        # The inventory groups, so the play is --limit safe
        _inventory_control: "{{ groups[baremetal_talos_controlplane_group] | default([]) }}"
        _inventory_worker: "{{ groups[baremetal_talos_worker_group] | default([]) }}"
        _inventory_cluster: "{{ _inventory_control + _inventory_worker }}"
        _nodes_cluster: "{{ _baremetal_cluster_nodes.resources | map(attribute='metadata.name') }}"
        _nodes_control: >-
          {{ _baremetal_cluster_nodes.resources
             | selectattr('metadata.labels', 'contains', 'node-role.kubernetes.io/control-plane')
             | map(attribute='metadata.name') }}
        _nodes_worker: "{{ _nodes_cluster | difference(_nodes_control) }}"
      when: _baremetal_cluster_readable | bool

    - name: Debug orphan members
      ansible.builtin.debug:
        msg: "The following orphan members will be decommissioned {{ _baremetal_talos_orphans | list }}"
      when: _baremetal_talos_orphans | length > 0
