---
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    talos_controlplane:
      hosts:
        talos-control-01:
          ansible_host: 172.16.31.11
        talos-control-02:
          ansible_host: 172.16.31.12
        talos-control-03:
          ansible_host: 172.16.31.13
    # Split so a scenario can point baremetal_talos_worker_group at the core and
    # leave the rest out of the inventory the run converges to. talos_worker still
    # carries all three, so every other scenario sees the fleet whole.
    talos_worker:
      children:
        talos_worker_core:
          hosts:
            talos-worker-01:
              ansible_host: 172.16.31.21
            talos-worker-02:
              ansible_host: 172.16.31.22
        talos_worker_scale:
          hosts:
            talos-worker-03:
              ansible_host: 172.16.31.23
  vars:
    machine:
      memory: 2560
      vcpu: 2
      disk: 10737418240
