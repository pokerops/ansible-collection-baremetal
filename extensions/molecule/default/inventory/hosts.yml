---
# Source of truth for what machines exist. The libvirt scenario renders this into
# tofu variables; the bare metal scenario will consume it directly.
#
# Machines are hosts under a role group, role groups under a profile group, and
# profile groups under `nodes`. Each level earns its place: `nodes` is what the
# collection targets, `talos` selects the profile, and the role groups are how
# config generation tells a control plane from a worker.
#
# Required per host, asserted by pokerops.baremetal.validate:
#
#   baremetal_host_address  Static address in CIDR-less form. The network runs no
#                           DHCP, so this is the only way a node becomes
#                           reachable, and it is written into the machine config.
#   baremetal_host_name     Hostname Talos applies. Kept equal to the inventory
#                           name here; it is separate because nothing forces them
#                           to agree.
#
# Absent on purpose:
#
#   baremetal_bmc_system_id  Authored on real hardware (iDRAC serves one system
#                            per endpoint as System.Embedded.1). Under sushy it is
#                            the libvirt domain uuid, so create.yml discovers it
#                            and writes it into host_vars.
#
# `machine` is how to fabricate a machine in the test environment, so it has no
# counterpart on bare metal -- you do not fabricate a chassis.
all:
  hosts:
    # Explicit so create/destroy resolve group_vars/all.yml the same way every
    # other play does. Ansible's implicit localhost is outside the inventory and
    # picks up no group variables at all.
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    nodes:
      children:
        talos:
          children:
            talos_controlplane:
              hosts:
                talos-cp-01:
                  baremetal_host_address: 172.16.31.11
                  baremetal_host_name: talos-cp-01
                talos-cp-02:
                  baremetal_host_address: 172.16.31.12
                  baremetal_host_name: talos-cp-02
                talos-cp-03:
                  baremetal_host_address: 172.16.31.13
                  baremetal_host_name: talos-cp-03
            talos_worker:
              hosts:
                talos-worker-01:
                  baremetal_host_address: 172.16.31.21
                  baremetal_host_name: talos-worker-01
                talos-worker-02:
                  baremetal_host_address: 172.16.31.22
                  baremetal_host_name: talos-worker-02
                talos-worker-03:
                  baremetal_host_address: 172.16.31.23
                  baremetal_host_name: talos-worker-03
          vars:
            machine:
              memory: 2560
              vcpu: 2
              disk: 10737418240
