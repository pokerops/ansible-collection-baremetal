---
- name: Reset the simulated BMC's stale boot entry before a reinstall
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Dump the current domain definition
      ansible.builtin.command:
        cmd: "virsh -c qemu:///system dumpxml {{ _nvram_reset_target }}"
      changed_when: false
      register: _nvram_reset_xml

    - name: Save the domain definition
      ansible.builtin.tempfile:
        state: file
        suffix: .xml
      register: _nvram_reset_file

    - name: Write the domain definition
      ansible.builtin.copy:
        dest: "{{ _nvram_reset_file.path }}"
        content: "{{ _nvram_reset_xml.stdout }}"
        mode: "0600"

    - name: Record the current NVRAM path
      ansible.builtin.set_fact:
        _nvram_reset_path: >-
          {{ (_nvram_reset_xml.stdout | regex_search('<nvram[^>]*>([^<]+)</nvram>', '\1') | first) }}

    - name: Drop the domain and its NVRAM
      ansible.builtin.command:
        cmd: "virsh -c qemu:///system undefine {{ _nvram_reset_target }} --nvram"
      changed_when: true

    - name: Confirm the old NVRAM file is actually gone
      ansible.builtin.stat:
        path: "{{ _nvram_reset_path }}"
      register: _nvram_reset_check

    - name: Assert the undefine actually removed it
      ansible.builtin.assert:
        that:
          - not _nvram_reset_check.stat.exists
        fail_msg: >-
          {{ _nvram_reset_path }} still exists after `virsh undefine --nvram`. The
          reinstall that follows this will hit the same stale boot entry it always
          has.

    - name: Redefine the domain identically
      ansible.builtin.command:
        cmd: "virsh -c qemu:///system define {{ _nvram_reset_file.path }}"
      changed_when: true

    - name: Remove the saved domain definition
      ansible.builtin.file:
        path: "{{ _nvram_reset_file.path }}"
        state: absent
