---
- name: Prepare KVM host
  hosts: localhost
  connection: local
  vars:
    _libvirt_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
  tasks:
    - name: Verify host distribution support
      ansible.builtin.assert:
        that:
          - _distro in ['Ubuntu', 'Debian'] or _family == 'Darwin'
          - _family == 'Darwin' or _distro == 'Ubuntu' or _version is version('12', '>=')
          - _family == 'Darwin' or _distro == 'Debian' or _version is version('22.04', '>=')
        msg: "Unsupported distribution or version. Supported: Ubuntu 22.04+, Debian 12+."
      vars:
        _family: "{{ ansible_facts['os_family'] }}"
        _distro: "{{ ansible_facts['distribution'] }}"
        _version: "{{ ansible_facts['distribution_version'] }}"

    - name: Configure Debian libvirt daemon
      when: ansible_facts['os_family'] == 'Debian'
      become: true
      block:
        - name: Install deb package requirements
          ansible.builtin.apt:
            name:
              - qemu-kvm
              - "{{ _qemu_efi }}"
              - libvirt-clients
              - libvirt-daemon-system
              - libvirt-daemon-system-systemd
              - xorriso
            update_cache: true
          vars:
            _is_ubuntu: "{{ ansible_facts['distribution'] == 'Ubuntu' }}"
            _is_noble: "{{ ansible_facts['distribution_version'] is version('24.04', '>=') }}"
            _is_debian: "{{ ansible_facts['distribution'] == 'Debian' }}"
            _is_trixie: "{{ ansible_facts['distribution_version'] is version('13', '>=') }}"
            _is_debian_modern: "{{ (_is_ubuntu and _is_noble) or (_is_debian and _is_trixie) }}"
            _qemu_efi: "qemu-efi{{ '-aarch64' if (_is_debian_modern) else '' }}"

        - name: Add user to libvirt group
          ansible.builtin.user:
            name: "{{ _libvirt_user }}"
            groups: "libvirt"
            append: true

        - name: Query user groups
          ansible.builtin.command: "groups {{ _libvirt_user }}"
          register: _user_groups
          changed_when: false

        - name: Ensure user is in libvirt group
          ansible.builtin.assert:
            that: _groups | select('equalto', 'libvirt') | list | length > 0
            fail_msg: "User '{{ _libvirt_user }}' is not in the 'libvirt' group"
          vars:
            _groups: "{{ _user_groups.stdout.split() }}"
